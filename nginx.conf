# Run as non-root (UID 101 in nginxinc/nginx-unprivileged) with a read-only root
# filesystem; PID and all temporary paths live under /tmp (mounted as emptyDir),
# and cache paths live under /var/cache/nginx (mounted as emptyDir).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temporary paths on /tmp so readOnlyRootFilesystem works with /tmp and /var/cache/nginx emptyDirs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Behind the gateway and tunnel the pod's own host:port is meaningless; keep redirects relative.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        text/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers copied from vercel.json, applied to every response.
        # No child location uses add_header so nginx inherits these into every location block.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://github-contributions-api.jogruber.de; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Short cache default for HTML documents.
        expires 5m;

        # Redirect external requests for /index.html to / without looping internal index resolution.
        if ($request_uri ~ ^/index\.html(?:$|\?)) {
            return 301 /;
        }

        # Liveness / readiness probe endpoint.
        location = /healthz {
            access_log off;
            expires off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Fast 404 in the lab so site.js immediately falls back to the public contributions API in the browser.
        location = /api/contributions {
            expires off;
            return 404;
        }

        # Asset URLs carry no content hash (/styles.css, /site.js), so a long cache would
        # keep serving old CSS/JS for months after a release. Only fonts change rarely
        # enough to cache for a year.
        location ~* \.woff2$ {
            expires 1y;
            try_files $uri =404;
        }
        location ~* \.(?:webp|png|ico|svg)$ {
            expires 7d;
            try_files $uri =404;
        }
        location ~* \.(?:css|js)$ {
            expires 1h;
            try_files $uri =404;
        }

        # Clean URLs: /work -> /work.html, / -> /index.html, else 404.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
